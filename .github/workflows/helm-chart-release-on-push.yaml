name: Release Chart on branch
on:
  push:
    branches-ignore:
      - 'main'
    paths:
      - '*/**'
      - '!.github/**'

concurrency:
  group: chart-release

jobs:
  preperation:
    uses: dBildungsplattform/dbp-github-workflows/.github/workflows/get-context.yaml@4b5c0434f28b537e9199ffebc21f4e6e39cbcdde # 8.4.3
  scan:
    # https://github.com/actions/runner/issues/1917#issuecomment-2505051075
    needs: [preperation]
    uses: dBildungsplattform/dbp-github-workflows/.github/workflows/check-helm-kics.yaml@4b5c0434f28b537e9199ffebc21f4e6e39cbcdde # 8.4.3
    permissions:
      contents: read
    with: 
      chart_path: "."
  release_helm:
    # https://github.com/actions/runner/issues/1917#issuecomment-2505051075
    needs: [preperation]
    uses: dBildungsplattform/dbp-github-workflows/.github/workflows/chart-release.yaml@4b5c0434f28b537e9199ffebc21f4e6e39cbcdde # 8.4.3
    secrets: inherit
    with:
      chart_path: "."
      chart_name: ${{needs.preperation.outputs.context}}
      helm_chart_version_generation: ticket_from_branch_timestamp
      image_tag_generation: chart_yaml
